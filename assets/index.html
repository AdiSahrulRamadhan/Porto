  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --font-sans: "Inter", Arial, sans-serif;
      --color-page: #f4f8ff;
      --color-ink: #121b2e;
      --color-muted: #637188;
      --color-accent: #00bdb6;
      --color-line: #d9e5f5;
      --color-nav-light: rgba(240, 243, 248, 0.8);
      --color-nav-dark: rgba(23, 35, 55, 0.9);
    }

    @layer base {
      html {
        color-scheme: light;
      }

      html.dark {
        color-scheme: dark;
      }

      [hidden] {
        display: none !important;
      }

      a,
      button,
      [tabindex] {
        outline-offset: 5px;
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 2px solid var(--color-accent);
      }

      svg {
        display: block;
        flex-shrink: 0;
      }

      a[href],
      button:enabled,
      summary {
        cursor: pointer;
      }
    }

    @keyframes marquee {
      to {
        transform: translate3d(-50%, 0, 0);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .type-cursor {
      animation: blink 1s steps(1) infinite;
    }

    .tech-track {
      animation: marquee 105s linear infinite;
    }

    .tech-strip:hover .tech-track,
    .tech-strip:focus-within .tech-track {
      animation-play-state: paused;
    }

    .tech-mask {
      -webkit-mask-image: linear-gradient(
        to right,
        transparent,
        #000 35px,
        #000 calc(100% - 35px),
        transparent
      );

      mask-image: linear-gradient(
        to right,
        transparent,
        #000 35px,
        #000 calc(100% - 35px),
        transparent
      );
    }

    .certificate-scroller {
      scrollbar-width: none;
    }

    .certificate-scroller::-webkit-scrollbar {
      display: none;
    }

    .scroll-reveal {
      opacity: 0;
      transform: translate3d(0, 35px, 0);
      transition:
        opacity 800ms ease,
        transform 800ms cubic-bezier(.2, .75, .2, 1);
    }

    .scroll-reveal.is-visible {
      opacity: 1;
      transform: none;
    }

    dialog::backdrop {
      background: rgba(10, 22, 40, .6);
      backdrop-filter: blur(7px);
    }

    #achievement-chevron {
      transition: transform 260ms cubic-bezier(.2, .75, .2, 1);
    }

    #achievement-menu[data-open="true"] #achievement-chevron {
      transform: rotate(180deg);
    }

    .achievement-dropdown {
      opacity: 0;
      transform: translate3d(0, -8px, 0) scale(.97);
      pointer-events: none;
      transform-origin: top left;

      transition:
        opacity 200ms ease,
        transform 200ms cubic-bezier(.2, .75, .2, 1);
    }

    #achievement-menu[data-open="true"] .achievement-dropdown {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      #achievement-chevron,
      .achievement-dropdown {
        transition: none;
      }

      .type-cursor {
        animation: none;
      }

      .tech-track {
        animation: none;
        width: 100%;
        will-change: auto;
      }

      .tech-group {
        width: 100%;
        flex-wrap: wrap;
        justify-content: center;
        padding: 15px;
      }

      .tech-group[aria-hidden="true"] {
        display: none;
      }

      .tech-mask {
        mask-image: none;
        -webkit-mask-image: none;
      }

      .scroll-reveal {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }
    .dark #theme-button:hover {
      color: #ffffff;
      background: color-mix(in oklab, #19273c 80%, transparent);
    }
  </style>

  <script>
    try {
      const saved = localStorage.getItem("asr-theme");

      document.documentElement.classList.toggle(
        "dark",
        saved === "dark" ||
        (
          saved !== "light" &&
          matchMedia("(prefers-color-scheme: dark)").matches
        )
      );
    } catch {
      document.documentElement.classList.toggle(
        "dark",
        matchMedia("(prefers-color-scheme: dark)").matches
      );
    }
  </script>

      function imageBox(
        src,
        alt,
        fallback,
        imageClass = "h-full w-full object-contain"
      ) {
        return `
          <div data-image-fallback class="h-full w-full">
            ${fallback}
          </div>

          <img
            data-fallback-image
            hidden
            src="${esc(src)}"
            alt="${esc(alt)}"
            loading="lazy"
            class="${imageClass}"
          />
        `;
      }

      function wireImages(root = document) {
        root.querySelectorAll("img[data-fallback-image]").forEach(img => {
          if (img.dataset.wired) return;

          img.dataset.wired = "true";

          const fallback = img.parentElement.querySelector(
            "[data-image-fallback]"
          );

          const update = success => {
            img.hidden = !success;

            if (fallback) {
              fallback.hidden = success;
            }
          };

          img.addEventListener("load", () => update(true), {
            once: true
          });

          img.addEventListener("error", () => update(false), {
            once: true
          });

          if (img.complete) {
            update(img.naturalWidth > 0);
          }
        });
      }

      function indexSkillSvg(symbol) {

      function indexSkillIcon(definition) {
        if (!definition.logo) return indexSkillSvg(definition.symbol);
        const mark = definition.mark || "</>";
        return `
          <span data-logo-fallback class="grid place-items-center" aria-hidden="true">
            <svg width="25" height="25" viewBox="0 0 28 28" aria-hidden="true">
              <rect x="2" y="2" width="24" height="24" rx="7"

                font-size="${mark.length > 2 ? 8 : 11}"
                font-weight="800" text-anchor="middle">${esc(mark)}</text>
            </svg>
          </span>
          <img data-skill-logo hidden
            src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/${definition.logo}"
            alt="" width="25" height="25" decoding="async"
            class="skill-brand-logo ${definition.contrast ? "skill-logo-contrast" : ""}" />
        `;
      }

      function updateIndexSkillLogo(image, loaded) {
        const fallback = image.parentElement?.querySelector("[data-logo-fallback]");
        image.hidden = !loaded;
        if (fallback) fallback.hidden = loaded;
      }

      // Capture load/error before the app creates its image elements.
      document.addEventListener("load", event => {
        if (event.target instanceof HTMLImageElement &&
            event.target.hasAttribute("data-skill-logo")) {
          updateIndexSkillLogo(event.target, event.target.naturalWidth > 0);
        }
      }, true);

      document.addEventListener("error", event => {
        if (event.target instanceof HTMLImageElement &&
            event.target.hasAttribute("data-skill-logo")) {
          updateIndexSkillLogo(event.target, false);
        }
      }, true);

      requestAnimationFrame(() => {
        document.querySelectorAll("#skills img[data-skill-logo]").forEach(image => {
          if (image.complete) updateIndexSkillLogo(image, image.naturalWidth > 0);
        });
      });

            const target = Number(element.dataset.count);
            const start = performance.now();

            function tick(now) {
              const progress = Math.min((now - start) / 1100, 1);

              element.textContent = Math.round(
                target * (1 - Math.pow(1 - progress, 3))
              );

              if (progress < 1) {
                requestAnimationFrame(tick);

            }

            requestAnimationFrame(tick);
            statsObserver.unobserve(element);

        selected = index;

        galleryImages = [
          imageFor(index),
          ...(certificates[index].extraImages || [])

        [
          "certificate-thumbnails",

              "aria-label",
              "Show image " + (imageIndex + 1)
            );

              if (img.getAttribute("src") !== imagePlaceholder) {
                img.src = imagePlaceholder;
              }
            });

            button.append(img);

            button.addEventListener("click", () => {

          thumbnails.hidden = galleryImages.length < 2;

      function renderImage(index) {
        if (!galleryImages.length) return;

        activeImage = (
          index + galleryImages.length

        const caption =
          (activeImage + 1) + " / " + galleryImages.length;

          const img = document.getElementById(id);
          img.src = galleryImages[activeImage];

        const logical = position % count;

        slides.forEach((slide, index) => {
          const visible =
            index === position ||
            index === position + 1;

          slide.inert = !visible;
          slide.setAttribute("aria-hidden", String(!visible));
        });

        dots.forEach((dot, index) => {
          dot.setAttribute(
            "aria-pressed",
            String(index === logical)

      }

      function settle() {
        if (position >= count) {
          show(position % count, false);
        }
      }

      track.addEventListener("transitionend", event => {
        if (
          event.target === track &&
          event.propertyName === "transform"
        ) {
          settle();
        }
      });

      function advance() {
        settle();
        void track.offsetWidth;
        show(position + 1);

        if (reduced.matches) {
          settle();
        }
      }

      function schedule() {
        clearInterval(timer);

        pause.textContent = paused ? "Play" : "Pause";
        pause.setAttribute(
          "aria-label",
          paused ? "Play automatic slides" : "Pause automatic slides"
        );

        if (
          paused ||
          !visible ||
          document.hidden ||
          carousel.contains(document.activeElement) ||
          document.querySelector("dialog[open]")
        ) {
          return;
        }

        timer = setInterval(advance, duration);
      }

      document.getElementById("slider-next").addEventListener("click", () => {
        advance();
        schedule();
      });

      document.getElementById("slider-prev").addEventListener("click", () => {
        show((position % count - 1 + count) % count);
        schedule();
      });

      dots.forEach(dot => {
        dot.addEventListener("click", () => {
          show(Number(dot.dataset.slide));
          schedule();
        });
      });

      pause.addEventListener("click", () => {
        paused = !paused;
        schedule();

      carousel.addEventListener("focusin", schedule);
      carousel.addEventListener("focusout", () => {
        setTimeout(schedule, 0);
      });

        paused = event.matches;

      // =====================================================
      // TYPEWRITER
      // =====================================================

      if (!motion.matches) {
        const typed = document.getElementById("typed-role");

        const roles = [
          "SOFTWARE ENGINEER",
          "FULL-STACK DEVELOPER",
          "WEB DEVELOPER"
        ];

        let index = 0;
        let length = roles[0].length;
        let deleting = true;

        function type() {
          length += deleting ? -1 : 1;

          typed.textContent = roles[index].slice(0, length);

          let delay = deleting ? 40 : 85;

          if (!deleting && length === roles[index].length) {
            deleting = true;
            delay = 1900;
          } else if (deleting && length === 0) {
            deleting = false;
            index = (index + 1) % roles.length;
            delay = 350;
          }

          setTimeout(type, delay);
        }

        setTimeout(type, 2000);
      }

      // =====================================================
      // TECHNOLOGY MARQUEE
      // =====================================================

      function createTechGroup(duplicate = false) {
        const group = document.createElement("ul");

        group.className =
          "tech-group m-0 flex w-max shrink-0 list-none items-center gap-3 py-2.5 pr-3 pl-0 sm:gap-[15px] sm:pr-[15px]";

        if (duplicate) {
          group.setAttribute("aria-hidden", "true");
        }

        TECH.forEach(([name, slug, short]) => {
          const item = document.createElement("li");
          const badge = document.createElement("span");
          const fallback = document.createElement("span");
          const img = document.createElement("img");

          badge.className =
            "tech-badge relative grid size-[43px] shrink-0 cursor-help place-items-center rounded-full border border-line bg-[#f5f9ff] text-muted transition-colors hover:border-accent hover:scale-105 hover:bg-accent/10 sm:size-12 dark:border-[#34455d] dark:bg-[#19263b] dark:text-[#a8b8cc]";

          badge.dataset.name = name;

          if (!duplicate) {
            badge.tabIndex = 0;
            badge.setAttribute("role", "img");
            badge.setAttribute("aria-label", name);
          }

          fallback.className =
            "text-[10px] font-bold tracking-[-.4px]";

          fallback.textContent = short;
          fallback.setAttribute("aria-hidden", "true");

          img.className =
            "size-[19px] object-contain dark:brightness-0 dark:invert-[.85]";

          img.alt = "";
          img.width = 19;
          img.height = 19;
          img.hidden = true;
          img.decoding = "async";
          img.draggable = false;

          img.addEventListener("load", () => {
            fallback.hidden = true;
            img.hidden = false;
          }, {
            once: true
          });

          img.src = `https://cdn.simpleicons.org/${slug}/62728A`;

          badge.append(fallback, img);
          item.append(badge);
          group.append(item);
        });

        return group;
      }

      document.getElementById("tech-track").append(
        createTechGroup(),
        createTechGroup(true)
      );

      // =====================================================
      // TECHNOLOGY TOOLTIP
      // =====================================================

      const strip = document.getElementById("tech-strip");
      const tooltip = document.getElementById("tech-tooltip");

      let hovered = null;
      let focused = null;
      let current = null;
      let dismissed = false;

      function findBadge(target) {
        if (!(target instanceof Element)) return null;

        const badge = target.closest(".tech-badge");

        return badge && strip.contains(badge) ? badge : null;
      }

      function positionTooltip() {
        if (!current || tooltip.hidden) return;

        const badgeRect = current.getBoundingClientRect();
        const stripRect = strip.getBoundingClientRect();

        const width = document.documentElement.clientWidth;
        const height = document.documentElement.clientHeight;

        const center = Math.max(
          stripRect.left + 24,
          Math.min(
            badgeRect.left + badgeRect.width / 2,
            stripRect.right - 24
          )
        );

        const left = Math.max(
          12,
          Math.min(
            center - tooltip.offsetWidth / 2,
            width - tooltip.offsetWidth - 12
          )
        );

        let top = stripRect.top - tooltip.offsetHeight - 10;

        if (top < 12) {
          top = stripRect.bottom + 10;
        }

        top = Math.max(
          12,
          Math.min(
            top,
            height - tooltip.offsetHeight - 12
          )
        );

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
      }

      function updateTooltip() {
        current?.removeAttribute("aria-describedby");

        current = hovered || focused;

        if (!current || dismissed) {
          tooltip.hidden = true;
          return;
        }

        tooltip.textContent = current.dataset.name;
        tooltip.hidden = false;

        if (!current.closest('[aria-hidden="true"]')) {
          current.setAttribute(
            "aria-describedby",
            tooltip.id
          );
        }

        positionTooltip();
      }

      strip.addEventListener("pointerover", event => {
        const badge = findBadge(event.target);

        if (badge === hovered) return;

        hovered = badge;
        dismissed = false;

        updateTooltip();
      });

      strip.addEventListener("pointerout", event => {
        const badge = findBadge(event.target);

        if (badge?.contains(event.relatedTarget)) return;

        hovered = findBadge(event.relatedTarget);
        dismissed = false;

        updateTooltip();
      });

      strip.addEventListener("pointerleave", () => {
        hovered = null;
        dismissed = false;

        updateTooltip();
      });

      strip.addEventListener("focusin", event => {
        focused = findBadge(event.target);
        dismissed = false;

        updateTooltip();
      });

      strip.addEventListener("focusout", event => {
        focused = findBadge(event.relatedTarget);
        dismissed = false;

        updateTooltip();
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          dismissed = true;
          updateTooltip();
        }
      });

      addEventListener("resize", positionTooltip);

      addEventListener("scroll", positionTooltip, {
        passive: true
      });
    })();

#ixp-award-dialog #ixp-award-description{font-size:15px;line-height:1.75;}
#ixp-zoom-award{border-radius:16px;}
.ixp-gallery-arrow{width:36px;height:36px;}
.ixp-gallery-prev{left:7px;}
.ixp-gallery-next{right:7px;}
#ixp-award-dialog .ixp-certificate-detail-tags{gap:8px;margin-top:20px;}
#ixp-award-dialog .ixp-certificate-detail-tags .ixp-skill-tag{padding:4px 8px;font-size:10px;}
#ixp-award-dialog .ixp-certificate-detail-tags .ixp-skill-tag svg{width:12px;height:12px;flex-basis:12px;}
#ixp-award-dialog .ixp-certificate-detail-meta{gap:10px;margin-top:20px;}
#ixp-award-dialog #ixp-award-date{font-size:10px;padding:6px 12px;}
#ixp-award-zoom{width:calc(100% - 20px);border-radius:22px;}
#ixp-award-zoom .ixp-award-dialog-panel{padding:18px 14px;}
#ixp-award-zoom .ixp-award-dialog-header{padding-bottom:16px;gap:12px;}
#ixp-award-zoom .ixp-award-dialog-header h2{font-size:16px;letter-spacing:-.2px;}
#ixp-award-zoom .ixp-close-award{width:36px;height:36px;}
#ixp-award-zoom .ixp-zoom-image-wrap{border-radius:14px;}
#ixp-award-zoom #ixp-zoom-image{height:clamp(120px,calc(94dvh - 210px),600px);}
#ixp-award-zoom .ixp-gallery-arrow{width:36px;height:36px;}
#ixp-award-zoom .ixp-gallery-prev{left:7px;}
#ixp-award-zoom .ixp-gallery-next{right:7px;}
#ixp-award-zoom .ixp-award-image-counter{right:10px;bottom:10px;padding:4px 10px;font-size:12px;}
#ixp-zoom-certificate-thumbnails{margin-top:14px;gap:8px;}
#ixp-zoom-certificate-thumbnails button{flex-basis:100px;height:66px;border-radius:10px;}
#ixp-zoom-certificate-thumbnails img{border-radius:7px;}
}
@media (prefers-reduced-motion:reduce){.ixp-reveal-item,.ixp-experience-card,.ixp-experience-cta-button,.ixp-card-preview img,.ixp-achievement-dropdown,#achievement-chevron{transition:none;}
.ixp-reveal-enabled .ixp-reveal-item{opacity:1;transform:none;}
.ixp-experience-card:hover{transform:none;}
}

</style>
<script>

(() => {
  "use strict";
  const section = document.getElementById("experience");
  if (!section || document.getElementById("ixp-experience-timeline")) return;
  const oldTimeline = section.querySelector(".relative.mt-10");
  if (!oldTimeline) return;
  const timeline = document.createElement("div");
  timeline.id = "ixp-experience-timeline";
  timeline.className = "ixp-timeline";
  const footer = document.createElement("div");
  footer.className = "mt-8 pl-8";
  footer.innerHTML = '<a href="experience.html" class="inline-flex items-center gap-2 text-sm font-medium text-accent hover:underline">View full timeline <span aria-hidden="true">→</span></a>';
  oldTimeline.replaceWith(timeline, footer);
  document.body.insertAdjacentHTML("beforeend", `<!-- EXPERIENCE DETAILS --><dialog id="ixp-award-dialog" aria-labelledby="ixp-award-title"><div class="ixp-award-dialog-panel"><header class="ixp-award-dialog-header"><div><p class="ixp-award-org" id="ixp-award-org"></p><h2 id="ixp-award-title"></h2></div><button type="button" class="ixp-close-award" id="ixp-close-award" aria-label="Close experience details" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" ><path d="m6 6 12 12M18 6 6 18" /></svg></button></header><div class="ixp-award-dialog-body"><div class="ixp-certificate-gallery"><button type="button" id="ixp-zoom-award" aria-label="Enlarge experience image" ><img id="ixp-award-detail-image" alt="" /><span id="ixp-detail-image-counter" class="ixp-award-image-counter" aria-live="polite" >1 / 1</span></button><button type="button" id="ixp-detail-image-prev" class="ixp-gallery-arrow ixp-gallery-prev" aria-label="Previous experience image" hidden ><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M19 12H5m7 7-7-7 7-7" /></svg></button><button type="button" id="ixp-detail-image-next" class="ixp-gallery-arrow ixp-gallery-next" aria-label="Next experience image" hidden ><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M5 12h14m-7-7 7 7-7 7" /></svg></button></div><div id="ixp-certificate-thumbnails" class="ixp-certificate-thumbnails" aria-label="Experience images" hidden ></div><p id="ixp-award-description"></p><ul id="ixp-experience-bullets" class="ixp-experience-bullets" ></ul><div id="ixp-certificate-detail-tags" class="ixp-certificate-detail-tags" ></div><div class="ixp-certificate-detail-meta"><p class="ixp-award-date" id="ixp-award-date"></p></div></div></div></dialog><!-- ZOOM --><dialog id="ixp-award-zoom" aria-labelledby="ixp-zoom-title"><div class="ixp-award-dialog-panel"><header class="ixp-award-dialog-header"><h2 id="ixp-zoom-title"></h2><button type="button" class="ixp-close-award" id="ixp-close-zoom" aria-label="Close image zoom" ><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" ><path d="m6 6 12 12M18 6 6 18" /></svg></button></header><div class="ixp-zoom-image-wrap ixp-certificate-gallery"><img id="ixp-zoom-image" alt="" /><button type="button" id="ixp-zoom-image-prev" class="ixp-gallery-arrow ixp-gallery-prev" aria-label="Previous experience image" hidden ><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M19 12H5m7 7-7-7 7-7" /></svg></button><button type="button" id="ixp-zoom-image-next" class="ixp-gallery-arrow ixp-gallery-next" aria-label="Next experience image" hidden ><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M5 12h14m-7-7 7 7-7 7" /></svg></button><span id="ixp-zoom-image-counter" class="ixp-award-image-counter" aria-live="polite" >1 / 1</span></div><div id="ixp-zoom-certificate-thumbnails" class="ixp-certificate-thumbnails" aria-label="Experience images in zoom" hidden ></div></div></dialog>`);
      const EXPERIENCES = [
        {
          title: "Research Assistant - Kampus Merdeka",

          org:
            "Bangkalan Regency Department of Agriculture, Fisheries and Food Security",

          date: "Feb 2026 – Jul 2026",

          summary:
            "Developed a web-based Decision Support System for Selecting Superior Rice Seed Varieties to support a more objective, measurable, and data-driven selection process. The system combines AHP and Fuzzy AHP for criteria weighting, with TOPSIS for preference scoring and ranking. Built with Python and Streamlit, it supports dataset uploads, preprocessing, and sensitivity analysis.",

          desc:
            "I developed a web-based Decision Support System for Selecting Superior Rice Seed Varieties to support a more objective, measurable, and data-driven selection process. The system combines the Analytical Hierarchy Process (AHP) and Fuzzy AHP to determine the priority weight of each criterion, while the Technique for Order Preference by Similarity to Ideal Solution (TOPSIS) is used to calculate preference scores and rank the available rice seed varieties. Built with Python and Streamlit, the system supports CSV and Excel dataset uploads, data preprocessing, criteria weighting, sensitivity analysis, alternative ranking, and result evaluation. Ranking stability and quality are measured using Spearman Rank Correlation and Normalized Discounted Cumulative Gain (NDCG), allowing users to compare results across multiple scenarios before selecting the most suitable variety. This system is designed for farmers, agricultural extension officers, researchers, and policymakers who require a transparent and accessible decision-making tool.",

          bullets: [
            "Built DSS with AHP/Fuzzy AHP for criteria weighting",
            "Used TOPSIS to calculate preference scores and rank rice seed varieties",
            "Python & Streamlit: CSV/Excel upload, preprocessing, sensitivity analysis",
            "Ranking evaluation: Spearman Rank Correlation & NDCG",
            "Target users: farmers, extension officers, researchers, policymakers"
          ],

          skills: [
            { name: "Python", icon: "python" },
            { name: "Streamlit", icon: "streamlit" },
            { name: "AHP", icon: "hierarchy" },
            { name: "Fuzzy AHP", icon: "hierarchy" },
            { name: "TOPSIS", icon: "ranking" },
            { name: "Data Analysis", icon: "analysis" }
          ],

          images: [
            "assets/experience/Riset-1.jpeg",
            "assets/experience/Riset-2.jpeg",
            "assets/experience/Riset-3.jpeg",
            "assets/experience/Riset-4.jpeg",
            "assets/experience/Riset-5.jpeg"
          ],

          logo: "assets/Logo Riset.png"
        },

        {
          title: "Full-Stack Web Developer Intern",

          org: "PT. Quantum HRM Internasional",

          date: "Feb 2025 – Jun 2025",

          summary:
            "Developed the R&D website and a dynamic profile website from scratch during my internship at PT. Quantum HRM Internasional. Used Laravel and native PHP for full-stack web development, implementing the front end, back-end logic, and database integration to support dynamic content.",

          desc:
            "Developed the R&D website and a dynamic profile website from scratch during my internship at PT. Quantum HRM Internasional. Used Laravel and native PHP for full-stack web development, implementing the front end, back-end logic, and database integration to support dynamic content.",

          bullets: [
            "Developed the R&D website from scratch using Laravel and native PHP.",
            "Built a dynamic profile website with database-driven content.",
            "Implemented front-end interfaces using HTML, CSS, and JavaScript.",
            "Developed back-end logic and integrated the database across both websites."
          ],

          skills: [
            { name: "Laravel", icon: "laravel" },
            { name: "Native PHP", icon: "php" },
            { name: "JavaScript", icon: "javascript" },
            { name: "HTML5", icon: "html" },
            { name: "CSS3", icon: "css" },
            { name: "Full-Stack Development", icon: "fullstack" },
            { name: "Database Management", icon: "database" }
          ],

          images: [
            "assets/experience/Magang-1.jpeg",
            "assets/experience/Magang-2.jpeg",
            "assets/experience/Magang-3.jpeg",
            "assets/experience/Magang-4.jpeg",
            "assets/experience/Magang-5.jpeg",
            "assets/experience/Magang-6.jpeg",
            "assets/experience/Magang-7.jpeg",
            "assets/experience/Magang-8.jpeg"
          ],

          logo: "assets/PT Quantum HRM Internasional.jpg"
        }
      ];

      const SKILL_ICONS = {
        code:
          '<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/>',

        laravel:
          '<path d="m3 5 5-3 5 3v6l-5 3-5-3V5Zm0 0 5 3 5-3M8 8v12l5 3 8-5V8l-5-3-3 2m0 4 3 2 5-3m-5 3v5l-8 5m5-12v7" transform="translate(0 -1) scale(.96)"/>',

        php:
          '<ellipse cx="12" cy="12" rx="10" ry="7"/><text x="12" y="14.6" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial,sans-serif" font-size="8" font-style="italic" font-weight="700">php</text>',

        javascript:
          '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 10v6a2 2 0 0 1-4 0m10-5c-3-2-5 2-2 3s2 4-1 3"/>',

        html:
          '<path d="m4 3 1.5 16L12 21l6.5-2L20 3H4Zm4 5h8l-.5 4H9l.3 3 2.7.8 2.7-.8.2-1.5"/>',

        css:
          '<path d="m4 3 1.5 16L12 21l6.5-2L20 3H4Zm4 5h8l-1 7-3 1-3-1-.2-2M9 11h6"/>',

        fullstack:
          '<rect x="3" y="3" width="18" height="12" rx="2"/><path d="M3 7h18m-13 4-2 1 2 1m8-2 2 1-2 1M12 15v4m-4 2h8m-4-2v2"/>',

        database:
          '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',

        python:
          '<path d="M12 3H8a3 3 0 0 0-3 3v3h7v3H5a3 3 0 0 0-3 3v1a3 3 0 0 0 3 3h3m4 2h4a3 3 0 0 0 3-3v-3h-7v-3h7a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3h-3"/><circle cx="9" cy="6" r=".8" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r=".8" fill="currentColor" stroke="none"/>',

        streamlit:
          '<path d="m3 8 5 3 4-6 4 6 5-3-3 11H6L3 8Zm5 3 4 5 4-5"/>',

        hierarchy:
          '<rect x="9" y="2" width="6" height="5" rx="1"/><rect x="2" y="17" width="6" height="5" rx="1"/><rect x="16" y="17" width="6" height="5" rx="1"/><path d="M12 7v5m-7 5v-5h14v5"/>',

        ranking:
          '<path d="M4 20V14h4v6m2 0V9h4v11m2 0V4h4v16M2 20h20"/>',

        analysis:
          '<path d="M4 3v17h17M7 14l4-4 4 2 5-6"/><circle cx="11" cy="10" r="1"/><circle cx="15" cy="12" r="1"/>'
      };

      const SKILL_COLORS = {
        laravel: "#ef4444",
        php: "#777bb3",
        javascript: "#a77300",
        html: "#dd5429",
        css: "#2875c4",
        fullstack: "#008f8a",
        database: "#55759a",
        python: "#3977a8",
        streamlit: "#e85158",
        hierarchy: "#7860b3",
        ranking: "#159183",
        analysis: "#387ac2"
      };

      const UI_ICONS = {
        arrow:
          '<path d="M5 12h14m-7-7 7 7-7 7"/>',

        fallback:
          '<rect x="3" y="3" width="18" height="12" rx="2"/><path d="M3 7h18m-13 4-2 1 2 1m8-2 2 1-2 1M12 15v5m-4 0h8"/>'
      };

      const $ = id => document.getElementById(id);

      const esc = value =>
        String(value).replace(/[&<>"']/g, character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[character]);

      function svg(paths, size = 16, color = "currentColor") {
        return `
          <svg
            width="${size}"
            height="${size}"
            viewBox="0 0 24 24"
            fill="none"
            stroke="${color}"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            ${paths}
          </svg>
        `;
      }

      function skillTags(item) {
        return item.skills.map(skill => `
          <span class="ixp-skill-tag">
            ${
              svg(
                SKILL_ICONS[skill.icon] || SKILL_ICONS.code,
                16,
                SKILL_COLORS[skill.icon] || "#008f8a"
              )
            }
            <span>${esc(skill.name)}</span>
          </span>
        `).join("");
      }

      /* RENDER EXPERIENCE CARDS */

      $("ixp-experience-timeline").innerHTML =
        EXPERIENCES.map((item, index) => `
          <div class="ixp-timeline-entry ixp-reveal-item">
            <article class="ixp-experience-card">
              <div class="ixp-card-header">
                <div class="ixp-card-heading">
                  <div class="ixp-company-icon">
                    <button
                      type="button"
                      class="ixp-icon-button"
                      data-experience="${index}"
                      aria-label="View ${esc(item.title)} details"
                    >
                      ${
                        item.logo
                          ? `
                            <img
                              src="${esc(item.logo)}"
                              alt="${esc(item.title)} logo"
                            />
                            <span hidden>
                              ${svg(UI_ICONS.fallback, 28)}
                            </span>
                          `
                          : svg(UI_ICONS.fallback, 28)
                      }
                    </button>
                  </div>

                  <div>
                    <h3 class="ixp-card-title">
                      <button
                        type="button"
                        class="ixp-title-button"
                        data-experience="${index}"
                      >
                        ${esc(item.title)}
                      </button>
                    </h3>

                    <p class="ixp-card-org">
                      ${esc(item.org)}
                      ${index === 1 ? " · Internship" : ""}
                    </p>
                  </div>
                </div>

                <span class="ixp-card-date">
                  ${esc(item.date)}
                </span>
              </div>

              <p class="ixp-card-summary ixp-justified">
                ${esc(item.summary)}
              </p>

              <ul class="ixp-experience-bullets">
                ${
                  item.bullets
                    .slice(0, index === 0 ? 3 : 4)
                    .map(bullet => `
                      <li><span>${esc(bullet)}</span></li>
                    `)
                    .join("")
                }
              </ul>

              <div class="ixp-card-skills">
                ${skillTags(item)}
              </div>

              <button
                type="button"
                class="ixp-view-details"
                data-experience="${index}"
                aria-haspopup="dialog"
              >
                View details
                ${svg(UI_ICONS.arrow, 14)}
              </button>

              <div class="ixp-card-previews">
                ${
                  item.images.slice(0, 4).map((src, imageIndex) => `
                    <button
                      type="button"
                      class="ixp-card-preview"
                      data-preview="${index}"
                      data-image="${imageIndex}"
                      aria-label="Enlarge ${esc(item.title)} image ${imageIndex + 1}"
                    >
                      <img
                        src="${esc(src)}"
                        alt="${esc(item.title)} — preview ${imageIndex + 1}"
                        loading="lazy"
                      />
                      ${
                        imageIndex === 3 && item.images.length > 4
                          ? `<span class="ixp-preview-count">+${item.images.length - 4}</span>`
                          : ""
                      }
                    </button>
                  `).join("")
                }
              </div>
            </article>
          </div>
        `).join("");

      /* LOGO FALLBACK */

      document.querySelectorAll(".ixp-company-icon img").forEach(img => {
        const showFallback = () => {
          img.hidden = true;
          img.nextElementSibling.hidden = false;
        };

        img.addEventListener("error", showFallback);

        if (img.complete && img.naturalWidth === 0) {
          showFallback();
        }
      });

      /* IMAGE FALLBACK */

      const imagePlaceholder =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#edf4fa"/><text x="600" y="400" text-anchor="middle" fill="#637188" font-family="Arial,sans-serif" font-size="28">Project image unavailable</text></svg>'
        );

      function imageFallback(img) {
        const fallback = () => {
          if (img.getAttribute("src") !== imagePlaceholder) img.src = imagePlaceholder;
        };
        img.addEventListener("error", fallback);
        if (img.complete && !img.naturalWidth && img.getAttribute("src")) fallback();
      }

      document.querySelectorAll(
        ".ixp-card-preview img, #ixp-award-detail-image, #ixp-zoom-image"
      ).forEach(imageFallback);

      /* GALLERY STATE */

      const dialog = $("ixp-award-dialog");
      const zoom = $("ixp-award-zoom");

      let selected = 0;
      let activeImage = 0;
      let galleryImages = [];
      let trigger = null;
      let savedOverflow = "";
      let scrollLocked = false;

      function syncScrollLock() {
        if (dialog.open || zoom.open) {
          if (!scrollLocked) {
            savedOverflow = document.body.style.overflow;
            scrollLocked = true;
          }

          document.body.style.overflow = "hidden";
        } else if (scrollLocked) {
          document.body.style.overflow = savedOverflow;
          scrollLocked = false;
        }
      }

      function setGallery(index, imageIndex = 0) {
        selected = index;
        galleryImages = EXPERIENCES[index].images;

        [
          "ixp-certificate-thumbnails",
          "ixp-zoom-certificate-thumbnails"
        ].forEach(id => {
          const thumbnails = $(id);

          thumbnails.replaceChildren();

          galleryImages.forEach((src, index) => {
            const button = document.createElement("button");
            button.type = "button";

            button.setAttribute(
              "aria-label",
              `Show image ${index + 1}`
            );

            const img = document.createElement("img");

            imageFallback(img);

            img.src = src;
            img.alt = `Preview ${index + 1}`;

            button.append(img);

            button.addEventListener("click", () => {
              renderImage(index);
            });

            thumbnails.append(button);
          });

          thumbnails.hidden = galleryImages.length < 2;
        });

        renderImage(imageIndex);
      }

      function renderImage(index) {
        if (!galleryImages.length) return;

        activeImage =
          (index + galleryImages.length) % galleryImages.length;

        [
          "ixp-award-detail-image",
          "ixp-zoom-image"
        ].forEach(id => {
          const img = $(id);

          img.src = galleryImages[activeImage];
          img.alt =
            `${EXPERIENCES[selected].title} — Image ${activeImage + 1}`;
        });

        [
          "ixp-detail-image-counter",
          "ixp-zoom-image-counter"
        ].forEach(id => {
          $(id).textContent =
            `${activeImage + 1} / ${galleryImages.length}`;
        });

        [
          "ixp-detail-image-prev",
          "ixp-detail-image-next",
          "ixp-zoom-image-prev",
          "ixp-zoom-image-next"
        ].forEach(id => {
          $(id).hidden = galleryImages.length < 2;
        });

        [
          "ixp-certificate-thumbnails",
          "ixp-zoom-certificate-thumbnails"
        ].forEach(id => {
          $(id).querySelectorAll("button").forEach(
            (button, imageIndex) => {
              button.setAttribute(
                "aria-pressed",
                String(imageIndex === activeImage)
              );
            }
          );
        });
      }

      /* VIEW DETAILS */

      function openDetails(index, button) {
        trigger = button;

        setGallery(index);

        const item = EXPERIENCES[index];

        $("ixp-award-title").textContent = item.title;
        $("ixp-award-org").textContent = item.org;
        $("ixp-award-description").textContent = item.desc;

        $("ixp-experience-bullets").innerHTML =
          item.bullets.map(bullet => `
            <li><span>${esc(bullet)}</span></li>
          `).join("");

        $("ixp-certificate-detail-tags").innerHTML = skillTags(item);
        $("ixp-award-date").textContent = item.date;

        if (!dialog.open) {
          dialog.showModal();
        }

        syncScrollLock();
      }

      /* ZOOM */

      function showPreview(index, imageIndex) {
        if (
          selected !== index ||
          !galleryImages.length ||
          !dialog.open
        ) {
          setGallery(index, imageIndex ?? 0);
        } else if (imageIndex !== undefined) {
          renderImage(imageIndex);
        }

        $("ixp-zoom-title").textContent = EXPERIENCES[index].title;

        if (!zoom.open) {
          zoom.showModal();
        }

        syncScrollLock();
      }

      section.querySelectorAll("[data-experience]").forEach(button => {
        button.addEventListener("click", () => {
          openDetails(
            Number(button.dataset.experience),
            button
          );
        });
      });

      section.querySelectorAll("[data-preview]").forEach(button => {
        button.addEventListener("click", () => {
          trigger = button;

          showPreview(
            Number(button.dataset.preview),
            Number(button.dataset.image)
          );
        });
      });

      $("ixp-zoom-award").addEventListener("click", () => {
        showPreview(selected);
      });

      $("ixp-close-award").addEventListener("click", () => {
        dialog.close();
      });

      $("ixp-close-zoom").addEventListener("click", () => {
        zoom.close();
      });

      /* CLOSE AND BACKDROP */

      [dialog, zoom].forEach(panel => {
        panel.addEventListener("close", () => {
          syncScrollLock();

          if (!dialog.open && !zoom.open) {
            trigger?.focus();
          }
        });

        panel.addEventListener("click", event => {
          if (event.target !== panel) return;

          const rect = panel.getBoundingClientRect();

          if (
            event.clientX < rect.left ||
            event.clientX > rect.right ||
            event.clientY < rect.top ||
            event.clientY > rect.bottom
          ) {
            panel.close();
          }
        });
      });

      /* GALLERY ARROWS */

      [
        "ixp-detail-image-prev",
        "ixp-zoom-image-prev"
      ].forEach(id => {
        $(id).addEventListener("click", () => {
          renderImage(activeImage - 1);
        });
      });

      [
        "ixp-detail-image-next",
        "ixp-zoom-image-next"
      ].forEach(id => {
        $(id).addEventListener("click", () => {
          renderImage(activeImage + 1);
        });
      });

      /* KEYBOARD */

      document.addEventListener("keydown", event => {
        if (!dialog.open && !zoom.open) return;

        if (
          event.key === "ArrowLeft" ||
          event.key === "ArrowRight"
        ) {
          event.preventDefault();

          renderImage(
            activeImage +
            (event.key === "ArrowLeft" ? -1 : 1)
          );
        }
      });

      /* MOBILE SWIPE */

      document.querySelectorAll(".ixp-certificate-gallery").forEach(gallery => {
        let start = null;
        gallery.addEventListener("touchcancel", () => {
          start = null;
        }, { passive: true });

        gallery.addEventListener(
          "touchstart",
          event => {
            start = {
              x: event.changedTouches[0].clientX,
              y: event.changedTouches[0].clientY
            };
          },
          { passive: true }
        );

        gallery.addEventListener(
          "touchend",
          event => {
            if (!start) return;

            const dx =
              event.changedTouches[0].clientX - start.x;

            const dy =
              event.changedTouches[0].clientY - start.y;

            if (
              Math.abs(dx) > 45 &&
              Math.abs(dx) > Math.abs(dy)
            ) {
              renderImage(
                activeImage + (dx < 0 ? 1 : -1)
              );
            }

            start = null;
          },
          { passive: true }
        );
      });


})();
</script>

  let savedOverflow = "", locked = false;
  function syncScroll() {
    if (dialog.open || zoom.open) {
      if (!locked) { savedOverflow = document.body.style.overflow; locked = true; }
      document.body.style.overflow = "hidden";
    } else if (locked) {
      document.body.style.overflow = savedOverflow;
      locked = false;
    }
  }

  function renderImage() {
    const award = awards[selected], total = award.images.length;
    ["award-detail-image", "zoom-image"].forEach(id => {
      $(id).src = award.images[selectedImage];
      $(id).alt = `${award.title} — image ${selectedImage + 1} of ${total}`;
    });
    ["award-image-counter", "zoom-image-counter"].forEach(id => {
      $(id).textContent = `${selectedImage + 1} / ${total}`;
      $(id).setAttribute("aria-label", `Image ${selectedImage + 1} of ${total}`);
    });
    ["award-image-prev", "award-image-next", "zoom-image-prev", "zoom-image-next"].forEach(id => { $(id).hidden = total < 2; });
    thumbnailIds.forEach(id => {
      $(id).querySelectorAll("button").forEach((button, index) => {
        button.setAttribute("aria-pressed", String(index === selectedImage));
      });
    });
  }

  function renderThumbnails() {
    const award = awards[selected];
    thumbnailIds.forEach(id => {
      const container = $(id);
      container.replaceChildren();
      award.images.forEach((src, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.setAttribute("aria-label", `Show image ${index + 1}`);
        const img = document.createElement("img");
        fallback(img);
        img.src = src;
        img.alt = `${award.title} — page ${index + 1}`;
        button.append(img);
        button.addEventListener("click", () => { selectedImage = index; renderImage(); });
        container.append(button);
      });
      container.hidden = award.images.length < 2;
    });
  }

  function move(step) {
    const total = awards[selected].images.length;
    selectedImage = (selectedImage + step + total) % total;
    renderImage();
  }

  section.querySelectorAll("[data-iaw-award]").forEach(button => {
    button.addEventListener("click", () => {
      selected = Number(button.dataset.iawAward);
      selectedImage = 0;
      trigger = button;
      const award = awards[selected];
      $("award-title").textContent = award.title;
      $("award-org").textContent = award.org;
      $("award-description").textContent = award.desc;
      $("award-date").textContent = "Awarded: " + award.date;
      renderThumbnails();
      renderImage();
      if (!dialog.open) dialog.showModal();
      syncScroll();
    });
  });
  ["award-image-prev", "zoom-image-prev"].forEach(id => $(id).addEventListener("click", () => move(-1)));
  ["award-image-next", "zoom-image-next"].forEach(id => $(id).addEventListener("click", () => move(1)));
  $("close-award").addEventListener("click", () => dialog.close());
  $("close-zoom").addEventListener("click", () => zoom.close());
  $("zoom-award").addEventListener("click", () => {
    $("zoom-title").textContent = awards[selected].title;
    renderImage();
    if (!zoom.open) zoom.showModal();
    syncScroll();
  });
  [dialog, zoom].forEach(panel => {
    panel.addEventListener("close", () => {
      syncScroll();
      if (!dialog.open && !zoom.open) trigger?.focus();
      else if (panel === zoom && dialog.open) $("zoom-award").focus();
    });
    panel.addEventListener("click", event => {
      if (event.target !== panel) return;
      const rect = panel.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) panel.close();
    });
  });
  document.addEventListener("keydown", event => {
    if (!dialog.open && !zoom.open) return;
    if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
      event.preventDefault();
      move(event.key === "ArrowLeft" ? -1 : 1);
    }
  });
})();
</script>

<script>

      "Presented ITAdventure Web Design Development Workshop and Training for around 30 students.",
      'Delivered the "Python Primer: Entering the Programming World with Python" session for over thirty students.'
    ]
  };
  const esc = value => String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
  const cap = size => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="m2 8 10-5 10 5-10 5ZM6 10v7c4 3 8 3 12 0v-7M22 8v8"/></svg>`;

  awards.insertAdjacentHTML("afterend", `
    <div aria-hidden="true" class="index-section-divider"><span class="index-divider-dot"></span></div>
    <section id="about-education" aria-labelledby="index-education-heading" class="index-section">
      <div class="mx-auto w-[calc(100%-36px)] max-w-[1320px] sm:w-[calc(100%-64px)]">
        <span class="inline-flex items-center rounded-full border border-line bg-white px-4 py-1.5 text-xs font-semibold tracking-wider text-[#556987] shadow-xs dark:border-[#00bdb6] dark:bg-[#00bdb6] dark:text-white dark:scale-105 dark:shadow-[0_4px_12px_rgba(0,189,182,0.35)]">

        </span>
        <h2 id="index-education-heading" class="mt-5 text-[30px] leading-[1.25] font-semibold tracking-[-1.2px] sm:text-[40px] lg:text-[46px]">
          Academic foundations behind<br class="hidden sm:block" />my engineering journey.
        </h2>
        <p class="mt-6 text-[15px] leading-relaxed text-muted sm:text-lg dark:text-[#a8b8cc]">
          Formal studies and learning milestones that shaped how I solve technical problems.
        </p>
        <div class="ied-card ied-outer mt-10">
          <p class="ied-label">EDUCATION</p>
          <article class="ied-card ied-inner">
            <div class="ied-header">
              <div class="ied-heading">
                <span class="ied-icon">${cap(26)}</span>

                  <h3 class="ied-degree">

                  <p class="ied-university">${esc(education.university)}</p>

  document.body.insertAdjacentHTML("beforeend", `
    <dialog id="index-education-modal" data-open="false" aria-labelledby="index-education-modal-degree">
      <div class="ied-modal-panel">
        <button type="button" class="ied-modal-close" id="index-education-close" aria-label="Close education details">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="ied-modal-header">
          <span class="ied-icon">${cap(28)}</span>
          <div>
            <p class="ied-modal-university">${esc(education.university)}</p>

        <div class="ied-modal-badges">
          <span class="ied-badge">${esc(education.period)}</span>
          <span class="ied-badge">GPA ${esc(education.gpa)}</span>
        </div>
      </div>
    </dialog>
  `);

  const modal = document.getElementById("index-education-modal");
  const close = document.getElementById("index-education-close");
  const motion = matchMedia("(prefers-reduced-motion: reduce)");
  let trigger = null, timer = null, closing = false;
  let previousRootOverflow = "", previousBodyOverflow = "";

  function open(button) {
    if (modal.open) return;
    clearTimeout(timer);
    trigger = button;
    closing = false;
    previousRootOverflow = document.documentElement.style.overflow;
    previousBodyOverflow = document.body.style.overflow;
    modal.dataset.open = "false";
    modal.showModal();
    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";
    void modal.offsetWidth;
    modal.dataset.open = "true";
    close.focus({ preventScroll: true });
  }
  function dismiss() {
    if (!modal.open || closing) return;
    closing = true;
    modal.dataset.open = "false";
    const finish = () => { if (modal.open) modal.close(); };
    if (motion.matches) finish();
    else timer = setTimeout(finish, 300);
  }
  ["index-education-degree", "index-education-details"].forEach(id => {
    const button = document.getElementById(id);
    button.addEventListener("click", () => open(button));
  });
  close.addEventListener("click", dismiss);
  modal.addEventListener("cancel", event => { event.preventDefault(); dismiss(); });
  modal.addEventListener("click", event => {
    if (event.target !== modal) return;
    const rect = modal.getBoundingClientRect();
    if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dismiss();
  });
  modal.addEventListener("close", () => {
    clearTimeout(timer);
    closing = false;
    modal.dataset.open = "false";
    document.documentElement.style.overflow = previousRootOverflow;
    document.body.style.overflow = previousBodyOverflow;
    trigger?.focus({ preventScroll: true });
    trigger = null;
  });
})();
</script>

<!-- Reveal each index item once per page load; refresh starts a new run. -->
<style>
  .index-scroll-pending { opacity: 0; translate: 0 28px; }
  .index-scroll-revealed {
    animation: index-scroll-entrance 700ms cubic-bezier(.2,.75,.2,1) both;
  }
  @keyframes index-scroll-entrance {
    from { opacity: 0; translate: 0 28px; }
    to { opacity: 1; translate: 0 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .index-scroll-pending, .index-scroll-revealed {
      opacity: 1; translate: none; animation: none;
    }
  }
</style>
<script>
(() => {
  "use strict";
  const motion = matchMedia("(prefers-reduced-motion: reduce)");
  if (motion.matches || !("IntersectionObserver" in window)) return;

  const items = new Set();
  function addContainer(container) {
    if (!container) return;
    [...container.children].forEach(child => {
      // Reveal cards separately; keep the certificate carousel as one unit.
      if (child.matches(".grid, #ixp-experience-timeline, #iaw-grid")) {
        [...child.children].forEach(item => items.add(item));
      } else {
        items.add(child);
      }
    });
  }
  document.querySelectorAll("#app main > section").forEach(section => {
    addContainer(section.firstElementChild);
  });
  addContainer(document.querySelector("#app > footer")?.firstElementChild);

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const item = entry.target;
      if (!entry.isIntersecting || item.dataset.indexRevealed === "true") return;
      item.dataset.indexRevealed = "true";
      item.classList.remove("index-scroll-pending");
      item.classList.add("index-scroll-revealed");
      observer.unobserve(item);
    });
  }, { threshold: .05, rootMargin: "0px 0px -24px 0px" });

  items.forEach(item => {
    item.classList.add("index-scroll-pending");
    observer.observe(item);
  });

  motion.addEventListener("change", event => {
    if (!event.matches) return;
    observer.disconnect();
    items.forEach(item => {
      item.dataset.indexRevealed = "true";
      item.classList.remove("index-scroll-pending", "index-scroll-revealed");
    });
  });
})();
</script>
