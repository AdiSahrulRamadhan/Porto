  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --font-sans: "Inter", Arial, sans-serif;
      --color-page: #f4f8ff;
      --color-ink: #121b2e;
      --color-muted: #637188;
      --color-accent: #00bdb6;
      --color-line: #d9e5f5;
      --color-nav-light: rgba(240, 243, 248, 0.8);
      --color-nav-dark: rgba(23, 35, 55, 0.9);
    }

    @layer base {
      html {
        color-scheme: light;
      }

      html.dark {
        color-scheme: dark;
      }

      [hidden] {
        display: none !important;
      }

      a,
      button,
      [tabindex] {
        outline-offset: 5px;
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 2px solid var(--color-accent);
      }

      svg {
        display: block;
        flex-shrink: 0;
      }

      a[href],
      button:enabled,
      summary {
        cursor: pointer;
      }
    }

    @keyframes marquee {
      to {
        transform: translate3d(-50%, 0, 0);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .type-cursor {
      animation: blink 1s steps(1) infinite;
    }

    .tech-track {
      animation: marquee 105s linear infinite;
    }

    .tech-strip:hover .tech-track,
    .tech-strip:focus-within .tech-track {
      animation-play-state: paused;
    }

    .tech-mask {
      -webkit-mask-image: linear-gradient(
        to right,
        transparent,
        #000 35px,
        #000 calc(100% - 35px),
        transparent
      );

      mask-image: linear-gradient(
        to right,
        transparent,
        #000 35px,
        #000 calc(100% - 35px),
        transparent
      );
    }

    .certificate-scroller {
      scrollbar-width: none;
    }

    .certificate-scroller::-webkit-scrollbar {
      display: none;
    }

    .scroll-reveal {
      opacity: 0;
      transform: translate3d(0, 35px, 0);
      transition:
        opacity 800ms ease,
        transform 800ms cubic-bezier(.2, .75, .2, 1);
    }

    .scroll-reveal.is-visible {
      opacity: 1;
      transform: none;
    }

    dialog::backdrop {
      background: rgba(10, 22, 40, .6);
      backdrop-filter: blur(7px);
    }

    #achievement-chevron {
      transition: transform 260ms cubic-bezier(.2, .75, .2, 1);
    }

    #achievement-menu[data-open="true"] #achievement-chevron {
      transform: rotate(180deg);
    }

    .achievement-dropdown {
      opacity: 0;
      transform: translate3d(0, -8px, 0) scale(.97);
      pointer-events: none;
      transform-origin: top left;

      transition:
        opacity 200ms ease,
        transform 200ms cubic-bezier(.2, .75, .2, 1);
    }

    #achievement-menu[data-open="true"] .achievement-dropdown {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      #achievement-chevron,
      .achievement-dropdown {
        transition: none;
      }

      .type-cursor {
        animation: none;
      }

      .tech-track {
        animation: none;
        width: 100%;
        will-change: auto;
      }

      .tech-group {
        width: 100%;
        flex-wrap: wrap;
        justify-content: center;
        padding: 15px;
      }

      .tech-group[aria-hidden="true"] {
        display: none;
      }

      .tech-mask {
        mask-image: none;
        -webkit-mask-image: none;
      }

      .scroll-reveal {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }
  </style>

  <script>
    try {
      const saved = localStorage.getItem("asr-theme");

      document.documentElement.classList.toggle(
        "dark",
        saved === "dark" ||
        (
          saved !== "light" &&
          matchMedia("(prefers-color-scheme: dark)").matches
        )
      );
    } catch {
      document.documentElement.classList.toggle(
        "dark",
        matchMedia("(prefers-color-scheme: dark)").matches
      );
    }
  </script>
</head>

      function esc(value) {
        return String(value).replace(/[&<>"']/g, character => ({

      function validURL(url) {
        return /^https?:\/\//i.test(url || "");

      function socialHref(key) {
        const value = DATA[key]?.trim();

        if (!value) return "";

        if (key === "email") {
          return `mailto:${value}`;

        return validURL(value) ? value : "";
      }

      function socialAttrs(key) {
        const href = socialHref(key);

        return href
          ? `href="${esc(href)}" ${

          : 'aria-disabled="true"';

      function imageBox(
        src,
        alt,
        fallback,
        imageClass = "h-full w-full object-contain"
      ) {
        return `
          <div data-image-fallback class="h-full w-full">
            ${fallback}
          </div>

          <img
            data-fallback-image
            hidden
            src="${esc(src)}"
            alt="${esc(alt)}"
            loading="lazy"
            class="${imageClass}"
          />
        `;
      }

      function wireImages(root = document) {
        root.querySelectorAll("img[data-fallback-image]").forEach(img => {
          if (img.dataset.wired) return;

          img.dataset.wired = "true";

          const fallback = img.parentElement.querySelector(
            "[data-image-fallback]"
          );

          const update = success => {
            img.hidden = !success;

            if (fallback) {
              fallback.hidden = success;
            }
          };

          img.addEventListener("load", () => update(true), {
            once: true
          });

          img.addEventListener("error", () => update(false), {
            once: true
          });

          if (img.complete) {
            update(img.naturalWidth > 0);
          }
        });
      }

      function setAchievementMenu(open) {
        clearTimeout(achievementCloseTimer);

        achievementMenu.dataset.open = String(open);

        achievementTrigger.setAttribute(
          "aria-expanded",
          String(open)
        );

        achievementDropdown.setAttribute(
          "aria-hidden",
          String(!open)
        );

        achievementDropdown.toggleAttribute("inert", !open);
      }

      function setMenu(open) {
        navigation.dataset.open = String(open);

        menuButton.setAttribute(
          "aria-expanded",
          String(open)
        );

        menuButton.setAttribute(
          "aria-label",
          open ? "Close menu" : "Open menu"
        );

        menuButton.innerHTML = icon(open ? "close" : "menu");

        if (!open) {
          setAchievementMenu(false);
        }
      }

      menuButton.addEventListener("click", () => {
        setMenu(navigation.dataset.open !== "true");
      });

      navigation.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", () => {
          setMenu(false);
        });
      });

      achievementTrigger.addEventListener("click", () => {
        setAchievementMenu(
          achievementMenu.dataset.open !== "true"
        );
      });

      // Hover untuk mouse, klik/tap untuk touch.
      const hoverDevice = matchMedia(
        "(hover: hover) and (pointer: fine)"
      );

      achievementMenu.addEventListener("mouseenter", () => {
        if (hoverDevice.matches) {
          setAchievementMenu(true);
        }
      });

      achievementMenu.addEventListener("mouseleave", () => {
        if (!hoverDevice.matches) return;

        achievementCloseTimer = setTimeout(() => {
          if (!achievementMenu.contains(document.activeElement)) {
            setAchievementMenu(false);
          }
        }, 150);
      });

      achievementMenu.addEventListener("focusout", event => {
        if (!achievementMenu.contains(event.relatedTarget)) {
          setAchievementMenu(false);
        }
      });

      achievementTrigger.addEventListener("keydown", event => {
        if (event.key !== "ArrowDown") return;

        event.preventDefault();

        setAchievementMenu(true);
        achievementDropdown.querySelector("a").focus();
      });

      document.addEventListener("click", event => {
        if (!header.contains(event.target)) {
          setMenu(false);
        } else if (!achievementMenu.contains(event.target)) {
          setAchievementMenu(false);
        }
      });

      document.addEventListener("keydown", event => {
        if (event.key !== "Escape") return;

        if (achievementMenu.dataset.open === "true") {
          setAchievementMenu(false);
          achievementTrigger.focus();
          return;
        }

        if (navigation.dataset.open === "true") {
          setMenu(false);
          menuButton.focus();
        }
      });

      matchMedia("(min-width:1024px)").addEventListener(
        "change",
        () => {
          setMenu(false);
        }
      );

      setAchievementMenu(false);

      // =====================================================
      // DARK MODE
      // =====================================================

      const themeButton = document.getElementById("theme-button");
      const systemTheme = matchMedia("(prefers-color-scheme:dark)");

      let selectedTheme = null;

      try {
        selectedTheme = localStorage.getItem("asr-theme");
      } catch {}

      function applyTheme(dark) {
        document.documentElement.classList.toggle("dark", dark);

        document.querySelector(
          'meta[name="theme-color"]'
        ).content = dark ? "#101827" : "#f4f8ff";

        themeButton.innerHTML = icon(dark ? "sun" : "moon");

        themeButton.setAttribute(
          "aria-pressed",
          String(dark)
        );

        themeButton.setAttribute(
          "aria-label",
          dark ? "Switch to light mode" : "Switch to dark mode"
        );
      }

      applyTheme(
        document.documentElement.classList.contains("dark")
      );

      themeButton.addEventListener("click", () => {
        const dark = !document.documentElement.classList.contains("dark");

        selectedTheme = dark ? "dark" : "light";

        applyTheme(dark);

        try {
          localStorage.setItem("asr-theme", selectedTheme);
        } catch {}
      });

      systemTheme.addEventListener("change", event => {
        if (
          selectedTheme !== "dark" &&
          selectedTheme !== "light"
        ) {
          applyTheme(event.matches);
        }
      });

      // =====================================================
      // EXPERIENCE DETAILS
      // =====================================================

      document.addEventListener("click", event => {
        const trigger = event.target.closest(
          "[data-experience-toggle]"
        );

        if (!trigger) return;

        const open = trigger.getAttribute("aria-expanded") !== "true";

        document.getElementById(
          `experience-${trigger.dataset.experienceToggle}`
        ).hidden = !open;

        trigger.setAttribute("aria-expanded", String(open));
        trigger.textContent = open ? "Hide details" : "View details";
      });

      // =====================================================
      // REVEAL ANIMATION AND COUNTERS
      // =====================================================

      if (!motion.matches && "IntersectionObserver" in window) {
        const revealObserver = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            entry.target.classList.toggle(
              "is-visible",
              entry.isIntersecting
            );
          });
        }, {
          threshold: 0,
          rootMargin: "0px 0px -25px 0px"
        });

        document.querySelectorAll("[data-reveal]").forEach(element => {
          element.classList.add("scroll-reveal");
          revealObserver.observe(element);
        });

        const statsObserver = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;

            const element = entry.target;
            const target = Number(element.dataset.count);
            const start = performance.now();

            function tick(now) {
              const progress = Math.min((now - start) / 1100, 1);

              element.textContent = Math.round(
                target * (1 - Math.pow(1 - progress, 3))
              );

              if (progress < 1) {
                requestAnimationFrame(tick);
              }
            }

            requestAnimationFrame(tick);
            statsObserver.unobserve(element);
          });
        }, {
          threshold: .5
        });

        document.querySelectorAll("[data-count]").forEach(element => {
          statsObserver.observe(element);
        });
      }

      // =====================================================
      // DETAILS MODAL
      // =====================================================

      const dialog = document.getElementById("detail-dialog");
      const dialogTitle = document.getElementById("dialog-title");
      const dialogContent = document.getElementById("dialog-content");
      const closeDialog = document.getElementById("dialog-close");

      let dialogTrigger = null;
      let previousOverflow = "";
      let refreshAutoplay = () => {};

      function openDialog(title, content, trigger) {
        if (!dialog.open) {
          dialogTrigger = trigger;

          previousOverflow = document.documentElement.style.overflow;
          document.documentElement.style.overflow = "hidden";
        }

        dialogTitle.textContent = title;
        dialogContent.innerHTML = content;

        wireImages(dialogContent);

        if (!dialog.open) {
          dialog.showModal();
        }

        dialog.scrollTop = 0;
        closeDialog.focus();

        refreshAutoplay();
      }

      closeDialog.addEventListener("click", () => {
        dialog.close();
      });

      dialog.addEventListener("click", event => {
        if (event.target !== dialog) return;

        const rect = dialog.getBoundingClientRect();

        if (
          event.clientX < rect.left ||
          event.clientX > rect.right ||
          event.clientY < rect.top ||
          event.clientY > rect.bottom
        ) {
          dialog.close();
        }
      });

      dialog.addEventListener("close", () => {
        document.documentElement.style.overflow = previousOverflow;

        if (dialogTrigger?.isConnected) {
          dialogTrigger.focus({
            preventScroll: true
          });
        }

        refreshAutoplay();
      });

      document.addEventListener("click", event => {
        const trigger = event.target.closest("[data-action]");

        if (!trigger) return;

        const actionName = trigger.dataset.action;
        const id = trigger.dataset.id;

        if (actionName === "all-projects") {
          openDialog(
            "All Projects",
            `
              <div class="grid items-start gap-5 md:grid-cols-2">
                ${DATA.projects.map(projectCard).join("")}
              </div>
            `,
            trigger
          );
        }

        if (actionName === "project") {
          const project = DATA.projects.find(item => item.id === id);

          if (!project) return;

          openDialog(
            project.title,
            `
              <p class="text-xs tracking-[1.7px] text-accent">
                ${project.category}
              </p>

              <p class="mt-5 leading-relaxed ${UI.muted}">
                ${esc(project.description)}
              </p>

              <h3 class="mt-7 font-semibold">
                Project highlights
              </h3>

              <div class="mt-4">
                ${bulletList(project.highlights)}
              </div>

              <div class="mt-7 flex flex-wrap gap-2">
                ${project.tags.map(tagHTML).join("")}
              </div>

              <p class="mt-7 text-xs ${UI.muted}">
                ${project.role} · ${project.period}
              </p>
            `,
            trigger
          );
        }

        if (actionName === "all-certificates") {
          openDialog(
            "All Certificates",
            `
              <div class="space-y-5">
                ${
                  DATA.certificates.map(
                    certificate => certificateCard(certificate)
                  ).join("")
                }
              </div>
            `,
            trigger
          );
        }

        if (actionName === "certificate") {
          const certificate = DATA.certificates.find(
            item => item.id === id
          );

          if (!certificate) return;

          openDialog(
            certificate.title,
            `
              <div class="grid gap-7 md:grid-cols-2">
                ${certificateImage(certificate)}

                <div>
                  <p class="text-xs tracking-[1.7px] text-accent">
                    ${esc(certificate.issuer)}
                  </p>

                  <p class="mt-5 leading-relaxed ${UI.muted}">
                    ${esc(certificate.description)}
                  </p>

                  <p class="mt-6 text-sm ${UI.muted}">
                    Issued: ${esc(certificate.issued || "—")}
                  </p>

                  <p class="mt-2 break-words text-sm ${UI.muted}">
                    Credential: ${esc(certificate.credential || "—")}
                  </p>

                  <div class="mt-6 flex flex-wrap gap-2">
                    ${certificate.tags.map(tagHTML).join("")}
                  </div>

                  ${
                    validURL(certificate.verifyUrl)
                      ? `
                        <div class="mt-7">
                          ${
                            button(
                              "Verify Certificate",
                              certificate.verifyUrl,
                              "primary",
                              'target="_blank" rel="noopener noreferrer"'
                            )
                          }
                        </div>
                      `
                      : ""
                  }
                </div>
              </div>
            `,
            trigger
          );
        }

        if (actionName === "all-skills") {
          openDialog(
            "Skills & Technologies",
            `
              <div class="grid gap-4 sm:grid-cols-2">
                ${DATA.skills.map(skillCard).join("")}
              </div>

              <h3 class="mt-9 text-lg font-semibold">
                Technology toolkit
              </h3>

              <div class="mt-5 flex flex-wrap gap-2">
                ${
                  TECH.map(([name, slug]) => {
                    return tagHTML([name, slug]);
                  }).join("")
                }
              </div>
            `,
            trigger
          );
        }

        if (actionName === "all-experience") {
          openDialog(
            "Full Timeline",
            `
              <div class="space-y-6">
                ${
                  DATA.experiences.map(experience => {
                    return experienceCard(experience, false, true);
                  }).join("")
                }
              </div>
            `,
            trigger
          );
        }

        if (actionName === "all-awards") {
          openDialog(
            "All Awards",
            `
              <div class="space-y-6">
                ${DATA.awards.map(award => awardCard(award)).join("")}
              </div>
            `,
            trigger
          );
        }

        if (actionName === "award") {
          const award = DATA.awards.find(item => item.id === id);

          if (!award) return;

          openDialog(
            award.title,
            `
              <div class="grid gap-7 md:grid-cols-2">
                ${awardImage(award)}

                <div>
                  <p class="text-xs text-accent">
                    ${award.date}
                  </p>

                  <p class="mt-4 text-sm font-medium">
                    ${esc(award.issuer)}
                  </p>

                  <p class="mt-5 text-sm leading-[1.8] ${UI.muted}">
                    ${esc(award.description)}
                  </p>

                  <div class="mt-6">
                    ${bulletList(award.details)}
                  </div>
                </div>
              </div>
            `,
            trigger
          );
        }
      });

      // =====================================================
      // CERTIFICATE CAROUSEL
      // =====================================================

      const carousel = document.getElementById("certificate-carousel");
      const scroller = document.getElementById("certificate-scroller");
      const dots = document.getElementById("certificate-dots");
      const play = document.getElementById("certificate-play");

      let certIndex = 0;
      let certTimer;
      let settleTimer;

      let certVisible = false;
      let certHovered = false;
      let certFocused = false;
      let certDragging = false;
      let certPaused = motion.matches;

      function certControls() {
        [...dots.children].forEach((dot, index) => {
          dot.dataset.current = String(index === certIndex);

          if (index === certIndex) {
            dot.setAttribute("aria-current", "true");
          } else {
            dot.removeAttribute("aria-current");
          }
        });

        play.innerHTML = icon(certPaused ? "play" : "pause");

        play.setAttribute(
          "aria-pressed",
          String(certPaused)
        );

        play.setAttribute(
          "aria-label",
          certPaused
            ? "Start automatic slides"
            : "Pause automatic slides"
        );
      }

      function scheduleCertificates() {
        clearTimeout(certTimer);

        if (
          DATA.certificates.length < 2 ||
          certPaused ||
          !certVisible ||
          certHovered ||
          certFocused ||
          certDragging ||
          document.hidden ||
          dialog.open
        ) {
          return;
        }

        certTimer = setTimeout(() => {
          goCertificate(certIndex + 1);
        }, DATA.certificateInterval);
      }

      function goCertificate(next) {
        certIndex = (
          next + DATA.certificates.length
        ) % DATA.certificates.length;

        const slide = scroller.children[certIndex];

        if (!slide) return;

        const left =
          slide.getBoundingClientRect().left -
          scroller.getBoundingClientRect().left +
          scroller.scrollLeft;

        scroller.scrollTo({
          left,
          behavior: motion.matches ? "instant" : "smooth"
        });

        certControls();
        scheduleCertificates();
      }

      refreshAutoplay = scheduleCertificates;

      scroller.addEventListener("scroll", () => {
        clearTimeout(certTimer);
        clearTimeout(settleTimer);

        settleTimer = setTimeout(() => {
          const max = scroller.scrollWidth - scroller.clientWidth;

          if (max > 0 && scroller.scrollLeft >= max - 3) {
            certIndex = DATA.certificates.length - 1;
          } else {
            let nearest = Infinity;
            const left = scroller.getBoundingClientRect().left;

            [...scroller.children].forEach((slide, index) => {
              const distance = Math.abs(
                slide.getBoundingClientRect().left - left
              );

              if (distance < nearest) {
                nearest = distance;
                certIndex = index;
              }
            });
          }

          certControls();
          scheduleCertificates();
        }, 180);
      }, {
        passive: true
      });

      dots.addEventListener("click", event => {
        const trigger = event.target.closest("[data-index]");

        if (trigger) {
          goCertificate(Number(trigger.dataset.index));
        }
      });

      document.getElementById("certificate-prev").addEventListener(
        "click",
        () => {
          goCertificate(certIndex - 1);
        }
      );

      document.getElementById("certificate-next").addEventListener(
        "click",
        () => {
          goCertificate(certIndex + 1);
        }
      );

      play.addEventListener("click", () => {
        certPaused = !certPaused;

        certControls();
        scheduleCertificates();
      });

      carousel.addEventListener("pointerenter", event => {
        if (event.pointerType !== "touch") {
          certHovered = true;
        }

        scheduleCertificates();
      });

      carousel.addEventListener("pointerleave", () => {
        certHovered = false;
        scheduleCertificates();
      });

      carousel.addEventListener("focusin", () => {
        certFocused = true;
        scheduleCertificates();
      });

      carousel.addEventListener("focusout", event => {
        certFocused = carousel.contains(event.relatedTarget);
        scheduleCertificates();
      });

      scroller.addEventListener("pointerdown", () => {
        certDragging = true;
        scheduleCertificates();
      });

      addEventListener("pointerup", () => {
        if (certDragging) {
          certDragging = false;
          scheduleCertificates();
        }
      });

      addEventListener("pointercancel", () => {
        certDragging = false;
        scheduleCertificates();
      });

      document.addEventListener(
        "visibilitychange",
        scheduleCertificates
      );

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(entries => {
          certVisible = entries[0].isIntersecting;
          scheduleCertificates();
        }, {
          threshold: .1
        }).observe(carousel);
      } else {
        certVisible = true;
      }

      motion.addEventListener("change", event => {
        if (event.matches) {
          certPaused = true;
        }

        certControls();
        scheduleCertificates();
      });

      certControls();
      scheduleCertificates();

      // =====================================================
      // TYPEWRITER
      // =====================================================

      if (!motion.matches) {
        const typed = document.getElementById("typed-role");

        const roles = [
          "SOFTWARE ENGINEER",
          "FULL-STACK DEVELOPER",
          "WEB DEVELOPER"
        ];

        let index = 0;
        let length = roles[0].length;
        let deleting = true;

        function type() {
          length += deleting ? -1 : 1;

          typed.textContent = roles[index].slice(0, length);

          let delay = deleting ? 40 : 85;

          if (!deleting && length === roles[index].length) {
            deleting = true;
            delay = 1900;
          } else if (deleting && length === 0) {
            deleting = false;
            index = (index + 1) % roles.length;
            delay = 350;
          }

          setTimeout(type, delay);
        }

        setTimeout(type, 2000);
      }

      // =====================================================
      // TECHNOLOGY MARQUEE
      // =====================================================

      function createTechGroup(duplicate = false) {
        const group = document.createElement("ul");

        group.className =
          "tech-group m-0 flex w-max shrink-0 list-none items-center gap-3 py-2.5 pr-3 pl-0 sm:gap-[15px] sm:pr-[15px]";

        if (duplicate) {
          group.setAttribute("aria-hidden", "true");
        }

        TECH.forEach(([name, slug, short]) => {
          const item = document.createElement("li");
          const badge = document.createElement("span");
          const fallback = document.createElement("span");
          const img = document.createElement("img");

          badge.className =
            "tech-badge relative grid size-[43px] shrink-0 cursor-help place-items-center rounded-full border border-line bg-[#f5f9ff] text-muted transition-colors hover:border-accent hover:bg-accent/10 sm:size-12 dark:border-[#34455d] dark:bg-[#19263b] dark:text-[#a8b8cc]";

          badge.dataset.name = name;

          if (!duplicate) {
            badge.tabIndex = 0;
            badge.setAttribute("role", "img");
            badge.setAttribute("aria-label", name);
          }

          fallback.className =
            "text-[10px] font-bold tracking-[-.4px]";

          fallback.textContent = short;
          fallback.setAttribute("aria-hidden", "true");

          img.className =
            "size-[19px] object-contain dark:brightness-0 dark:invert-[.85]";

          img.alt = "";
          img.width = 19;
          img.height = 19;
          img.hidden = true;
          img.decoding = "async";
          img.draggable = false;

          img.addEventListener("load", () => {
            fallback.hidden = true;
            img.hidden = false;
          }, {
            once: true
          });

          img.src = `https://cdn.simpleicons.org/${slug}/62728A`;

          badge.append(fallback, img);
          item.append(badge);
          group.append(item);
        });

        return group;
      }

      document.getElementById("tech-track").append(
        createTechGroup(),
        createTechGroup(true)
      );

      // =====================================================
      // TECHNOLOGY TOOLTIP
      // =====================================================

      const strip = document.getElementById("tech-strip");
      const tooltip = document.getElementById("tech-tooltip");

      let hovered = null;
      let focused = null;
      let current = null;
      let dismissed = false;

      function findBadge(target) {
        if (!(target instanceof Element)) return null;

        const badge = target.closest(".tech-badge");

        return badge && strip.contains(badge) ? badge : null;
      }

      function positionTooltip() {
        if (!current || tooltip.hidden) return;

        const badgeRect = current.getBoundingClientRect();
        const stripRect = strip.getBoundingClientRect();

        const width = document.documentElement.clientWidth;
        const height = document.documentElement.clientHeight;

        const center = Math.max(
          stripRect.left + 24,
          Math.min(
            badgeRect.left + badgeRect.width / 2,
            stripRect.right - 24
          )
        );

        const left = Math.max(
          12,
          Math.min(
            center - tooltip.offsetWidth / 2,
            width - tooltip.offsetWidth - 12
          )
        );

        let top = stripRect.top - tooltip.offsetHeight - 10;

        if (top < 12) {
          top = stripRect.bottom + 10;
        }

        top = Math.max(
          12,
          Math.min(
            top,
            height - tooltip.offsetHeight - 12
          )
        );

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
      }

      function updateTooltip() {
        current?.removeAttribute("aria-describedby");

        current = hovered || focused;

        if (!current || dismissed) {
          tooltip.hidden = true;
          return;
        }

        tooltip.textContent = current.dataset.name;
        tooltip.hidden = false;

        if (!current.closest('[aria-hidden="true"]')) {
          current.setAttribute(
            "aria-describedby",
            tooltip.id
          );
        }

        positionTooltip();
      }

      strip.addEventListener("pointerover", event => {
        const badge = findBadge(event.target);

        if (badge === hovered) return;

        hovered = badge;
        dismissed = false;

        updateTooltip();
      });

      strip.addEventListener("pointerout", event => {
        const badge = findBadge(event.target);

        if (badge?.contains(event.relatedTarget)) return;

        hovered = findBadge(event.relatedTarget);
        dismissed = false;

        updateTooltip();
      });

      strip.addEventListener("pointerleave", () => {
        hovered = null;
        dismissed = false;

        updateTooltip();
      });

      strip.addEventListener("focusin", event => {
        focused = findBadge(event.target);
        dismissed = false;

        updateTooltip();
      });

      strip.addEventListener("focusout", event => {
        focused = findBadge(event.relatedTarget);
        dismissed = false;

        updateTooltip();
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          dismissed = true;
          updateTooltip();
        }
      });

      addEventListener("resize", positionTooltip);

      addEventListener("scroll", positionTooltip, {
        passive: true
      });
    })();
  </script>
</body>
</html>
